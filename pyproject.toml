[project]
name = "akt-rabot-cli"
version = "1.0.0"
description = "Generate an Акт выполненных работ (RU work-completion act, HTML) from a JSON file. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "kleogeos", email = "kleogeos@gmail.com"}]
keywords = ["freelance", "akt", "samozanyatyy", "ru", "acceptance-act", "html", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/kleogeos/akt-rabot-cli"
Repository = "https://github.com/kleogeos/akt-rabot-cli"

[project.scripts]
akt = "akt:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["akt"]
